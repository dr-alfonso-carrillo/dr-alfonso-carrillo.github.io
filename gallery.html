<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery | Alfonso J. Carrillo</title>

  <style>

    /* =========================
       GENERAL
    ========================= */

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }


    /* =========================
       TOP NAVIGATION
    ========================= */

    .top-nav {
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }

    .nav-name {
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      color: #222;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      color: #222;
      font-size: 15px;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.55;
    }

    .nav-links a.active {
      font-weight: 600;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery-content {
      padding: 50px 0 90px;
    }

    .gallery-header {
      margin-bottom: 40px;
    }

    .gallery-header h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 600;
    }

    .gallery-line {
      width: 100%;
      height: 2px;
      background: #222;
      margin-top: 15px;
    }

    .gallery-intro {
      max-width: 850px;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 45px;
    }


    /* Image grid */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .gallery-item {
      margin: 0;
    }

    .gallery-item img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .gallery-item figcaption {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.5;
      color: #555;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .top-nav {
        flex-direction: column;
        gap: 20px;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px 22px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-item img {
        height: auto;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       TOP NAVIGATION
  ========================== -->

  <nav class="top-nav">

    <a href="index.html" class="nav-name">
      Alfonso J. Carrillo
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="publications.html">Publications</a>
      <a href="cv.html">CV</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="news.html">News</a>
    </div>

  </nav>


  <!-- =========================
       GALLERY CONTENT
  ========================== -->

  <main class="gallery-content">

    <div class="container">

      <div class="gallery-header">

        <h1>Gallery</h1>

        <div class="gallery-line"></div>

      </div>


      <p class="gallery-intro">
        A selection of moments from research, conferences, collaborations,
        laboratory work and scientific activities.
      </p>


      <div class="gallery-grid">

        <figure class="gallery-item">
          <img src="gallery1.jpg" alt="Gallery image 1">
          <figcaption>
            Caption for the first image.
          </figcaption>
        </figure>


        <figure class="gallery-item">
          <img src="gallery2.jpg" alt="Gallery image 2">
          <figcaption>
            Caption for the second image.
          </figcaption>
        </figure>


        <figure class="gallery-item">
          <img src="gallery3.jpg" alt="Gallery image 3">
          <figcaption>
            Caption for the third image.
          </figcaption>
        </figure>


        <figure class="gallery-item">
          <img src="gallery4.jpg" alt="Gallery image 4">
          <figcaption>
            Caption for the fourth image.
          </figcaption>
        </figure>


        <figure class="gallery-item">
          <img src="gallery5.jpg" alt="Gallery image 5">
          <figcaption>
            Caption for the fifth image.
          </figcaption>
        </figure>


        <figure class="gallery-item">
          <img src="gallery6.jpg" alt="Gallery image 6">
          <figcaption>
            Caption for the sixth image.
          </figcaption>
        </figure>

      </div>

    </div>

  </main>

</body>

</html>
